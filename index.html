<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2E8C96" />
    <meta
      name="description"
      content="Cross-border payments, collections and payouts across Africa. Local currency in, local currency out."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Rift" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO: the app lives behind auth; only the entry page is indexable.
         Marketing/ranking content is on riftfi.xyz. These tags give the
         app a correct canonical and a proper social preview when shared. -->
    <link rel="canonical" href="https://wallet.riftfi.com/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rift Wallet" />
    <meta property="og:title" content="Rift Wallet" />
    <meta
      property="og:description"
      content="Cross-border payments, collections and payouts across Africa. Local currency in, local currency out."
    />
    <meta property="og:url" content="https://wallet.riftfi.com/" />
    <meta property="og:image" content="https://wallet.riftfi.com/hero.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rift Wallet" />
    <meta
      name="twitter:description"
      content="Cross-border payments, collections and payouts across Africa. Local currency in, local currency out."
    />
    <meta name="twitter:image" content="https://wallet.riftfi.com/hero.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/rift.png" />
    <link rel="apple-touch-icon" href="/rift.png" />

    <!-- Fonts: Public Sans (UI + headings) and JetBrains Mono (references) via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Farcaster Mini App Embed Meta Tags (for sharing in social feeds) -->
    <meta
      name="fc:miniapp"
      content='{"version":"1","imageUrl":"https://wallet.riftfi.xyz/hero.png","button":{"title":"💰 Open Wallet","action":{"type":"launch_miniapp","name":"Rift Wallet","url":"https://wallet.riftfi.xyz","splashImageUrl":"https://wallet.riftfi.xyz/rift.png","splashBackgroundColor":"#2E8C96"}}}'
    />
    <!-- For backward compatibility -->
    <meta
      name="fc:frame"
      content='{"version":"1","imageUrl":"https://wallet.riftfi.xyz/hero.png","button":{"title":"💰 Open Wallet","action":{"type":"launch_frame","name":"Rift Wallet","url":"https://wallet.riftfi.xyz","splashImageUrl":"https://wallet.riftfi.xyz/rift.png","splashBackgroundColor":"#2E8C96"}}}'
    />

    <title>Rift - Payment Solutions</title>
  </head>
  <body oncontextmenu="return false">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
